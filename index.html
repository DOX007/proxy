<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webproxy</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; background: #1e1e24; color: #eee; }
  body { display: flex; flex-direction: column; }
  form { display: flex; gap: 6px; padding: 8px; background: #2b2b33; }
  button, select, input { font-size: 15px; border-radius: 6px; border: 1px solid #444; background: #3a3a44; color: #eee; padding: 8px 10px; }
  button { cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #url { flex: 1; min-width: 0; }
  #status { padding: 4px 10px; font-size: 12px; color: #aaa; background: #25252c; min-height: 22px; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<form id="form">
  <button type="button" id="back" disabled title="Bakåt">◀</button>
  <button type="button" id="fwd" disabled title="Framåt">▶</button>
  <button type="button" id="reload" title="Ladda om">⟳</button>
  <input id="url" type="text" placeholder="Skriv webbadress eller sökord" autocomplete="off" autofocus>
  <button type="submit">Gå</button>
</form>
<div id="status">Redo</div>
<iframe id="view" sandbox="allow-forms allow-scripts" title="Sida"></iframe>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const urlEl = $('url'), view = $('view'), status = $('status');
  const backBtn = $('back'), fwdBtn = $('fwd');
  const defaultProxyEndpoint = 'https://proxy-35p.pages.dev';
  let history = [], pos = -1;
  let activeRequest, requestId = 0;

  // Gör om inmatning till en giltig URL, annars sök via DuckDuckGo
  function normalize(input) {
    input = input.trim();
    if (!input) return null;
    if (/^https?:\/\//i.test(input)) return input;
    if (/^[^\s]+\.[a-z]{2,}(\/.*)?$/i.test(input)) return 'https://' + input;
    return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
  }

  function updateButtons() {
    backBtn.disabled = pos <= 0;
    fwdBtn.disabled = pos >= history.length - 1;
  }

  function workerUrl(path, target) {
    const endpoint = new URL(defaultProxyEndpoint);
    endpoint.pathname = path;
    if (target) endpoint.searchParams.set('url', target);
    return endpoint;
  }

  async function fetchVia(url) {
    if (activeRequest) activeRequest.abort();
    activeRequest = new AbortController();
    const response = await fetch(workerUrl('/proxy', url), { signal: activeRequest.signal });
    if (!response.ok) throw new Error('Worker svarade HTTP ' + response.status + ': ' + await response.text());
    const html = await response.text();
    if (!html.trim()) throw new Error('Worker returnerade en tom sida.');
    return { html };
  }

  // Bilder och stilmallar hämtas via proxyn så att hotlink-skydd och blockeringar inte slår ut dem
  function viaAsset(value, pageUrl) {
    try {
      const abs = new URL(value, pageUrl);
      if (!/^https?:$/.test(abs.protocol)) return value;
      return workerUrl('/asset', abs.href).href;
    } catch {
      return value;
    }
  }

  function rewriteAssets(doc, pageUrl) {
    doc.querySelectorAll('img[src], source[src], video[poster], input[type=image][src]').forEach(el => {
      const attr = el.hasAttribute('src') ? 'src' : 'poster';
      el.setAttribute(attr, viaAsset(el.getAttribute(attr), pageUrl));
    });
    doc.querySelectorAll('img[srcset], source[srcset]').forEach(el => {
      const rewritten = el.getAttribute('srcset').split(',').map(part => {
        const [src, ...rest] = part.trim().split(/\s+/);
        return src ? [viaAsset(src, pageUrl), ...rest].join(' ') : '';
      }).filter(Boolean).join(', ');
      el.setAttribute('srcset', rewritten);
    });
    doc.querySelectorAll('link[rel~=stylesheet][href]').forEach(el => {
      el.setAttribute('href', viaAsset(el.getAttribute('href'), pageUrl));
    });
    doc.querySelectorAll('[style*="url("]').forEach(el => {
      el.setAttribute('style', el.getAttribute('style').replace(/url\(\s*(["']?)([^"')]+)\1\s*\)/gi,
        (m, q, v) => /^data:/i.test(v.trim()) ? m : `url("${viaAsset(v.trim(), pageUrl)}")`));
    });
    doc.querySelectorAll('style').forEach(el => {
      el.textContent = el.textContent.replace(/url\(\s*(["']?)([^"')]+)\1\s*\)/gi,
        (m, q, v) => /^data:/i.test(v.trim()) ? m : `url("${viaAsset(v.trim(), pageUrl)}")`);
    });
  }

  async function load(url) {
    const currentRequest = ++requestId;
    urlEl.value = url;
    status.textContent = 'Hämtar via proxyn: ' + url + ' ...';
    try {
      const result = await fetchVia(url);
      if (currentRequest !== requestId) return;
      const { html } = result;
      const doc = new DOMParser().parseFromString(html, 'text/html');
      // <base> får relativa resurser att hämtas från originalsidan
      const base = doc.createElement('base');
      base.href = url;
      doc.head.prepend(base);
      rewriteAssets(doc, url);
      // Länkar skickas upp till föräldern så att de går via proxyn
      const script = doc.createElement('script');
      script.textContent = `
        document.addEventListener('click', e => {
          const a = e.target.closest && e.target.closest('a[href]');
          if (!a || a.href.startsWith('javascript:')) return;
          e.preventDefault();
          parent.postMessage({ proxyNav: a.href }, '*');
        }, true);
        document.addEventListener('submit', e => {
          const f = e.target;
          if ((f.method || 'get').toLowerCase() !== 'get') return;
          e.preventDefault();
          const u = new URL(f.action || location.href);
          new FormData(f).forEach((v, k) => { if (typeof v === 'string') u.searchParams.set(k, v); });
          parent.postMessage({ proxyNav: u.href }, '*');
        }, true);`;
      doc.body.append(script);
      view.srcdoc = '<!DOCTYPE html>' + doc.documentElement.outerHTML;
      status.textContent = url;
    } catch (err) {
      if (currentRequest !== requestId) return;
      const errorMessage = err.message === 'Failed to fetch'
        ? 'Anslutningen blockerades. Kontrollera att Cloudflare Pages har ALLOWED_ORIGIN=https://proxy-35p.pages.dev,https://dox007.github.io och att senaste bygget är klart.'
        : err.message;
      view.srcdoc = '<body style="font-family:sans-serif;padding:2em"><h2>Kunde inte ladda sidan</h2><p>'
        + String(errorMessage).replace(/</g, '&lt;') + '</p></body>';
      status.textContent = 'Fel: ' + errorMessage;
    }
  }

  function go(url, push = true) {
    if (!url) return;
    if (push) {
      history = history.slice(0, pos + 1);
      history.push(url);
      pos = history.length - 1;
    }
    updateButtons();
    load(url);
  }

  $('form').addEventListener('submit', e => { e.preventDefault(); go(normalize(urlEl.value)); });
  backBtn.onclick = () => { if (pos > 0) { pos--; go(history[pos], false); } };
  fwdBtn.onclick = () => { if (pos < history.length - 1) { pos++; go(history[pos], false); } };
  $('reload').onclick = () => { if (pos >= 0) load(history[pos]); };

  window.addEventListener('message', e => {
    if (e.source !== view.contentWindow || !e.data || typeof e.data.proxyNav !== 'string') return;
    if (/^https?:\/\//i.test(e.data.proxyNav)) go(e.data.proxyNav);
  });
})();
</script>
</body>
</html>
